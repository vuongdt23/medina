openapi: 3.1.0
info:
  title: Medina API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /search:
    get:
      summary: Full-text search of indexed library entries
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [lesson, section, course, asset] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Ranked search results from the active scan generation
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [lesson, section, course, asset] }
                        title: { type: string }
                        originalName: { type: string }
                        courseId: { type: string }
                        coursePath: { type: string }
                        streamUrl: { type: string }
                        thumbnailUrl: { type: string }
        '400': { description: Invalid query or filter }
  /progress/recent:
    get:
      summary: Recently played lessons for a client profile
      parameters:
        - in: header
          name: X-Medina-Profile
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: includeCompleted
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Recent playback progress joined with active library metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId: { type: string }
                        title: { type: string }
                        courseId: { type: string }
                        coursePath: { type: string }
                        positionSeconds: { type: number }
                        durationSeconds: { type: number }
                        completed: { type: boolean }
                        updatedAt: { type: string, format: date-time }
                        streamUrl: { type: string }
                        thumbnailUrl: { type: string }
        '400': { description: Missing profile or invalid query }
  /lessons/{itemID}/thumbnail:
    get:
        '200':
          description: WebP image with strong content ETag and cache headers
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/webp:
              schema: { type: string, format: binary }
        '304': { description: Thumbnail is unchanged }
        '404': { description: Thumbnail is not available }
    head:
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Thumbnail metadata }
        '404': { description: Thumbnail is not available }
  /assets/{itemID}/thumbnail:
    get:
        '200':
          description: WebP image with strong content ETag and cache headers
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/webp:
              schema: { type: string, format: binary }
        '304': { description: Thumbnail is unchanged }
        '404': { description: Thumbnail is not available }
  /health:
    get:
      responses:
        '200': { description: Service health }
  /system/info:
    get:
      responses:
        '200': { description: Service capabilities; thumbnails is true only when generation is enabled and ffmpeg plus a WebP encoder are available }
  /index/status:
    get:
      responses:
        '200':
          description: Index state and current in-progress snapshot item count
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [idle, scanning, failed] }
                  itemCount: { type: integer, description: Number of entries in the active snapshot, including the previous baseline during reconciliation }
                  progress:
                    description: In-memory progress for the latest scan in this server process; absent before the first scan
                    type: object
                    properties:
                      phase: { type: string, enum: [preparing, enumerating, canonicalizing, persisting, publishing, complete, failed] }
                      entriesVisited: { type: integer, description: Entries visited once during enumeration, including ignored and unclassified entries }
                      currentDirectory: { type: string, description: Root-relative directory currently being enumerated }
                      currentOperation: { type: string, enum: ['', queued, listing, metadata, ready, visiting], description: Operation awaited by the ordered traversal }
                      directoriesRead: { type: integer }
                      activeDirectoryReads: { type: integer }
                      activeMetadataReads: { type: integer }
                      elapsedMs: { type: integer }
                      enumerationMs: { type: integer, description: Aggregate directory-listing work time including active requests; concurrent operations overlap }
                      metadataMs: { type: integer, description: Aggregate metadata work time including active requests; concurrent operations overlap }
                      persistenceMs: { type: integer, description: Time spent persisting scanner batches; excludes generation preparation and final publication }
                  activeGenerationId: { type: [string, 'null'] }
                  lastScanStartedAt: { type: [string, 'null'], format: date-time }
                  lastScanCompletedAt: { type: [string, 'null'], format: date-time }
                  lastScanError: { type: [string, 'null'] }
  /index/scan:
    post:
      summary: Start a singleton background library scan
      description: Returns immediately. Poll /index/status for scan state and item count. A running scan cannot be resubmitted.
      responses:
        '202': { description: Scan accepted; poll the status endpoint }
        '409': { description: A library scan is already running }
  /libraries:
    get:
      responses:
        '200': { description: Configured libraries }
  /libraries/{libraryID}/courses:
    get:
      description: Course entries include derived per-profile progress and a thumbnailUrl when available. X-Medina-Profile is optional.
      parameters:
        - in: path
          name: libraryID
          required: true
          schema: { type: string }
        - in: header
          name: X-Medina-Profile
          required: false
          schema: { type: string }
      responses:
        '200': { description: Courses }
  /courses/{courseID}:
    get:
      description: Course metadata includes per-profile progress and thumbnailUrl when available. X-Medina-Profile is optional.
      parameters:
        - in: path
          name: courseID
          required: true
          schema: { type: string }
        - in: header
          name: X-Medina-Profile
          required: false
          schema: { type: string }
      responses:
        '200': { description: Course metadata }
  /courses/{courseID}/tree:
    get:
      parameters:
        - in: path
          name: courseID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Recursive course tree; lesson and image asset nodes expose thumbnailUrl when available, and lesson nodes include durationSeconds when media metadata is available }
  /courses/{courseID}/progress:
    get:
      summary: Aggregate lesson progress for a course
      description: Per-profile playback progress for every lesson beneath the course. The response includes completedCount, totalCount, and percent. Requires an X-Medina-Profile header identifying the client; the server has no user accounts.
      parameters:
        - in: path
          name: courseID
          required: true
          schema: { type: string }
        - in: header
          name: X-Medina-Profile
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Course progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessons:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        itemId: { type: string }
                        positionSeconds: { type: number }
                        durationSeconds: { type: number }
                        completed: { type: boolean }
                        updatedAt: { type: string, format: date-time }
                  completedCount: { type: integer }
                  totalCount: { type: integer }
                  percent: { type: integer, minimum: 0, maximum: 100 }
        '400': { description: Missing X-Medina-Profile header }
        '404': { description: Course not found }
  /lessons/{itemID}/progress:
    get:
      summary: Read playback progress for one lesson
      description: Returns the stored record for the profile, or a zero-value record when none exists. Requires an X-Medina-Profile header.
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
        - in: header
          name: X-Medina-Profile
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lesson progress record }
        '400': { description: Missing X-Medina-Profile header }
    put:
      summary: Store playback progress for one lesson
      description: Upserts per-profile playback progress. Completion becomes sticky when explicitly marked or playback reaches 95% of duration; it remains sticky unless completed:false is explicitly sent. Requires an X-Medina-Profile header.
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
        - in: header
          name: X-Medina-Profile
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                positionSeconds: { type: number }
                durationSeconds: { type: number }
                completed: { type: boolean }
      responses:
        '200': { description: Stored progress record }
        '400': { description: Missing header or invalid body }
        '404': { description: Lesson not found }
  /lessons/{itemID}/content:
    get:
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Original lesson bytes }
        '206': { description: Partial content }
        '416': { description: Range not satisfiable }
  /assets/{itemID}/preview:
    get:
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Safe inline preview for supported document, image, or text assets }
        '404': { description: Asset not found }
        '415': { description: Unsupported asset preview type }
  /assets/{itemID}/archive.zip:
    get:
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
      responses:
        '200': { description: ZIP archive of a directory asset }
        '404': { description: Asset directory not found or unavailable }
        '413': { description: Archive source-size, compressed-size, or file-count limit exceeded }
        '500': { description: Archive read, compression, or temporary-storage failure }
  /assets/{itemID}/content:
    get:
      parameters:
        - in: path
          name: itemID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Original asset bytes }
        '206': { description: Partial content }
  /:
    get:
      responses:
        '200': { description: Bundled diagnostic client }
